name: Bug report
description: Report a reproducible problem in opengorky.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private canvas content, credentials, or personal data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Firefox 142, Safari 19
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: opengorky version or commit
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Add sanitized screenshots or console errors if useful.
